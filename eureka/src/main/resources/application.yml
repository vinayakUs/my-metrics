spring:
  application:
    name: eureka
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false
      password: ${CONFIG_SERVICE_PASSWORD}
      username: user
eureka:
  instance:
    prefer-ip-address: true
  client:
    registerWithEureka: false
    fetchRegistry: false
server:
  port: 8761
