<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${status} + ' - Server Error'">500 - Server Error</title>

    <style>
        :root{--bg:#f6f8fa;--card:#ffffff;--muted:#6b7280;--accent:#2563eb}
        *{box-sizing:border-box}
        html,body{height:100%}
        body{margin:0;font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:var(--bg); color:#111827}
        .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
        .card{background:var(--card);padding:36px;max-width:880px;width:100%;border-radius:12px;box-shadow:0 6px 24px rgba(15,23,42,0.06);display:flex;gap:28px;align-items:center}
        .status{flex:0 0 160px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:linear-gradient(180deg,rgba(37,99,235,0.08),transparent);height:120px}
        .status h1{margin:0;font-size:48px;letter-spacing:-1px;color:var(--accent)}
        .content{flex:1}
        .content h2{margin:0 0 8px;font-size:20px}
        .content p{margin:0 0 16px;color:var(--muted)}
        .meta{font-size:13px;color:var(--muted);margin-top:8px}
        .actions{margin-top:18px;display:flex;gap:12px}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:600}
        .btn-primary{background:var(--accent);color:white}
        .btn-muted{background:transparent;color:var(--accent);border:1px solid rgba(37,99,235,0.12)}
        @media (max-width:600px){
            .card{flex-direction:column;align-items:flex-start}
            .status{width:100%;height:88px}
            .status h1{font-size:36px}
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="status">
            <h1 th:text="${status}">500</h1>
        </div>

        <div class="content">
            <h2>Something went wrong.</h2>
            <p th:text="${error} ?: 'The server encountered an unexpected condition that prevented it from fulfilling the request.'">Internal Server Error — please try again later.</p>

            <div class="meta">
                <div>Path: <span th:text="${path}">/example</span></div>
                <div th:if="${message}">Message: <span th:text="${message}">-</span></div>
            </div>

            <div class="actions">
                <a class="btn btn-primary" th:href="@{/}">Go to Home</a>
                <a class="btn btn-muted" th:href="@{/help}">Contact Support</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
