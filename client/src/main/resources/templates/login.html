<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f3f4f6; /* light gray, clean feel */
        }

        .login-button {
            background-color: #1d4ed8; /* ThemeLead-like blue */
            color: white;
            padding: 14px 32px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease;
        }

        .login-button:hover {
            background-color: #2563eb; /* darker blue on hover */
        }
    </style>
</head>
<body>
<a href="/oauth2/authorization/messaging-client-oidc">
    <button class="login-button">Login</button>
</a>
</body>
</html>
