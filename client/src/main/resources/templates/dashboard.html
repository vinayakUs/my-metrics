<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Piggy Metrics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>

        html, body {
            margin: 0;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column; /* Makes body a vertical flex container */

        }

        .main-content {
            flex: 1; /* This grows to fill the space above the footer */
        }

        .circle-button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 24px;
            border: 1px solid #8ecae6;
            color: #8ecae6;
            background-color: transparent;
            justify-content: center;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .circle-button:hover {
            background-color: rgba(142, 202, 230, 0.1); /* light hover effect */
            cursor: pointer;
        }

        .circle-button:active {
            transform: scale(0.95);
            background-color: rgba(142, 202, 230, 0.2); /* slightly darker on click */
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-top: 10px;
        }

        .section-subtitle {
            font-size: 12px;
            color: #6c757d;
            font-style: italic;
        }


        .savings-input {
            width: 120px;
            font-size: 24px;
            font-weight: 400;
            border: none;
            /*border-bottom: 1px solid #8ecae6;*/
            border-radius: 0;
            outline: none;
            background-color: transparent;
            color: #212529;
            padding-left: 0;
        }

        .savings-input:focus {
            /*border-bottom: 2px solid #219ebc;*/
            box-shadow: none;
        }

        .animated-button {
            transition: all 0.2s ease-in-out;
            transform: scale(1);
        }

        .animated-button:hover {
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .animated-button:hover {
            transform: scale(1.05); /* Slight zoom effect */
            background-color: #8ecae6;
            color: white;
            border-color: #8ecae6;
        }

        .animated-button:active {
            transform: scale(0.97); /* Click shrink effect */
        }


        .plus-button {
            position: relative;
            height: 75px;
            width: 75px;
            border-radius: 50%;
            border: 1px solid #aad6df;
            background-color: transparent;
            cursor: pointer;
            padding: 0;
            transition: background-color 150ms ease, transform 150ms ease;
        }

        .plus-button:hover {
            background-color: rgba(170, 214, 223, 0.1);
            transform: scale(1.05);
        }

        .plus-horizontal {
            width: 50%;
            height: 2px; /* horizontal line */
        }

        .plus-vertical {
            width: 2px; /* vertical line */
            height: 50%;
        }

        .plus-horizontal,
        .plus-vertical {
            position: absolute;
            background-color: #8ecae6;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .plus-button:active {
            transform: scale(0.92); /* shrink slightly on click */
        }


        /* Custom Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .modal-overlay.show {
            display: flex;
        }
        .custom-modal {
            width: 420px;
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            transition: all 0.3s ease;
            z-index: 10000; /* Ensure modal is above overlay */
        }
        .modal-header {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 1.5rem;
        }
        .modal-header h2 {
            margin: 0;
            font-size: 1.3rem;
            color: #023047;
            flex: 1;
            text-align: center;
        }
        .modal-header .close-btn {
            position: absolute;
            right: 0;
            top: 0;
            font-size: 1.3rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
        }
        .input-section {
            text-align: center;
        }
        .amount-input {
            font-size: 2.6rem;
            text-align: center;
            padding: 0.4rem;
            width: 100%;
            margin: 0 auto 1rem;
            border: 2px solid #cceef9;
            border-radius: 0;
            background-color: white;
            outline: none;
        }
        .amount-input:focus {
            border-color: #8ecae6;
            box-shadow: 0 0 0 2px rgba(142, 202, 230, 0.25);
        }
        .select-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.2rem;
        }
        .select-group select {
            padding: 0.6rem 1rem;
            font-size: 1rem;
            border: 2px solid #cceef9;
            background: white;
            border-radius: 0;
            appearance: none;
        }
        .select-group select:focus {
            border-color: #8ecae6;
            box-shadow: 0 0 0 2px rgba(142, 202, 230, 0.25);
            outline: none;
        }
        .icon-trigger {
            cursor: pointer;
            background: none;
            border: none;
            font-size: 2rem;
            transition: transform 0.2s ease;
            margin: 1.2rem auto;
        }
        .icon-trigger:hover {
            transform: scale(1.1);
        }
        .icon-grid-wrapper {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.4s ease;
        }
        .icon-grid-wrapper.show {
            max-height: 300px;
        }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            justify-items: center;
            padding-top: 1rem;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .icon-grid-wrapper.show .icon-grid {
            opacity: 1;
            transform: translateY(0);
        }
        .icon-option {
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .icon-option:hover {
            transform: scale(1.2);
            color: #0077cc;
        }
        .title-input {
            width: 100%;
            padding: 0.6rem;
            margin-top: 1rem;
            border: 2px solid #cceef9;
            border-radius: 0;
            font-size: 1rem;
            box-sizing: border-box;
            background: white;
            outline: none;
        }
        .title-input:focus {
            border-color: #8ecae6;
            box-shadow: 0 0 0 2px rgba(142, 202, 230, 0.25);
        }
        .save-btn {
            display: block;
            width: 100%;
            margin-top: 1.5rem;
            padding: 0.75rem;
            background: #cceef9;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .save-btn:hover {
            background: #a6d7e9;
        }
        .scrollable-container {
            overflow-y: auto;
            scrollbar-width: none;          /* Firefox */
            -ms-overflow-style: none;       /* Internet Explorer */
        }
        .scrollable-container::-webkit-scrollbar {
            display: none;                  /* Chrome, Safari */
        }


    </style>
</head>
<body class="bg-white text-dark">
<div class="main-content">
    <div class="container text-center mt-5">
        <img alt="Piggy Icon" src="/images/piggy-icon.svg" style="width: 96px;">
        <h1 class="mt-3 fw-bold">PIGGY <br> <span class="fw-light">METRICS</span></h1>
    </div>
    <div class="container mt-5">


        <div class="row d-flex justify-content-evenly text-center">

            <!-- Incomes -->
            <div class="col-md-3     mb-4">
                <div class="d-flex align-items-center justify-content-center mb-2" style="gap: 8px;">

                    <button style="width: 24px; height: 24px;" class="plus-button" onclick="toggleModal('income',true)">
                        <span class="plus-horizontal"></span>
                        <span class="plus-vertical"></span>
                    </button>


                    <div class="section-title m-0">INCOMES</div>
                </div>
                <hr class="border-info opacity-50  mx-auto">

                <div style="max-height: 300px" class="scrollable-container" th:if="${account.getIncomes() != null and !account.incomes.isEmpty() }">

                    <div class="d-flex flex-column gap-2">

                        <div th:each="income : ${account.incomes}"
                             class="d-flex justify-content-between align-items-center border-bottom px-2 py-2"
                             style="min-width: 100%;">
                            <!-- Left: Icon + Title -->
                            <div class="d-flex align-items-center gap-2 w-50">
                                <span class="fs-5" th:text="${income.icon}">💰</span>
                                <span class="text-muted" th:text="${income.title}">Income Title</span>
                            </div>
                            <!-- Right: Amount + Currency -->
                            <div class="text-end w-50">
                                <div class="fw-bold" th:text="12">1,000</div>
                                <div class="small text-muted">
                                    <span th:text="${income.currency}">USD</span>
                                    <span th:if="${income.period != null}"> / <span th:text="${income.period}">MONTH</span></span>
                                </div>
                            </div>
                        </div>

                        </div>



                 </div>
                <div th:unless="${account.getIncomes() != null and !account.incomes.isEmpty() }">

                    <div class="section-subtitle mb-2">EMPTY SPACE</div>

                    <button class="plus-button" onclick="toggleModal('income',true)">
                        <span class="plus-horizontal"></span>
                        <span class="plus-vertical"></span>
                    </button>


                    <div class="mt-1" style="font-size: 0.8rem; color: #6c757d;">ADD INCOME</div>

                </div>



            </div>

            <!-- Expenses -->
            <div class="col-md-3 mb-4">
                <div class="d-flex align-items-center justify-content-center mb-2" style="gap: 8px;">
                    <button style="width: 24px; height: 24px;" class="plus-button" onclick="toggleModal('expense',true)">
                        <span class="plus-horizontal"></span>
                        <span class="plus-vertical"></span>
                    </button>
                    <div class="section-title m-0">EXPENSES</div>
                </div>
                <hr class="border-info opacity-50  mx-auto">
<!--                <div style="max-height: 300px" class="scrollable-container" th:if="${account.getIncomes() != null and !account.incomes.isEmpty() }">-->

                <div th:if="${account.getExpenses() != null and !account.expenses.isEmpty()}">

                    <div class="d-flex flex-column gap-2">

                        <div th:each="expense : ${account.expenses}"
                             class="d-flex justify-content-between align-items-center border-bottom px-2 py-2"
                             style="min-width: 100%;">
                            <!-- Left: Icon + Title -->
                            <div class="d-flex align-items-center gap-2 w-50">
                                <span class="fs-5" th:text="${expense.icon}">💰</span>
                                <span class="text-muted" th:text="${expense.title}">Income Title</span>
                            </div>
                            <!-- Right: Amount + Currency -->
                            <div class="text-end w-50">
                                <div class="fw-bold" th:text="12">1,000</div>
                                <div class="small text-muted">
                                    <span th:text="${expense.currency}">USD</span>
                                    <span th:if="${expense.period != null}"> / <span th:text="${expense.period}">MONTH</span></span>
                                </div>
                            </div>
                        </div>

                    </div>









                </div>

                <div th:unless="${account.getExpenses() != null and !account.expenses.isEmpty()}">

                    <div class="section-subtitle mb-3">EMPTY SPACE</div>
                    <button class="plus-button" onclick="toggleModal('expense',true)">
                        <span class="plus-horizontal"></span>
                        <span class="plus-vertical"></span>
                    </button>
                    <div class="mt-2" style="font-size: 0.8rem; color: #6c757d;">ADD EXPENSE</div>



                </div>









            </div>


            <!-- Savings -->
            <div class="col-md-3 mb-4">
                <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
                    <span>$</span>
                    <div class="section-title m-0">SAVINGS</div>
                </div>


                <hr class="border-info opacity-50  mx-auto">


                <div class="d-flex justify-content-center align-items-start mt-3">
                    <img alt="Piggy" class="me-3" src="/images/piggy-small.svg"
                         style="width: 24px; height: 24px; margin-top: 2px;">
                    <div class="text-start">
                        <div style="font-size: 13px; font-weight: 500;">MY SPARE MONEY</div>
                        <div style="font-size: 11px; font-style: italic; color: #8ecae6;">AT THE MOMENT</div>
                        <input class="savings-input mt-2" placeholder="0.00" type="text">
                    </div>

                </div>
                <hr class="border-secondary opacity-20 w-50 mx-auto">

                <!-- ACCUMULATION ACCOUNT -->
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div style="font-size: 13px; font-weight: 600; color: #495057;">ACCUMULATION ACCOUNT</div>
                        <div style="font-size: 11px; font-style: italic; color: #adb5bd;">INTEREST</div>
                    </div>
                    <div class="form-check form-switch m-0">
                        <input class="form-check-input" role="switch" type="checkbox">
                    </div>
                </div>


                <!--            <div class="d-flex justify-content-center align-items-center mt-3">-->
                <!--                <img src="/images/piggy-small.svg" alt="Piggy" style="width: 24px; height: 24px;" class="me-3">-->
                <!--                <div class="text-start">-->
                <!--                    <div style="font-size: 13px; font-weight: 500;">MY SPARE MONEY</div>-->
                <!--                    <div style="font-size: 11px; font-style: italic; color: #8ecae6;">AT THE MOMENT</div>-->
                <!--                    <input type="text" class="savings-input mt-2" placeholder="0.00">-->

                <!--                </div>-->
                <!--            </div>-->





                <!-- INCOME Modal (Custom) -->
                <div class="modal-overlay" id="incomeModal">
                    <div class="custom-modal">
                        <div class="modal-header">
                            <h2>ADD Income</h2>
                            <button class="close-btn" onclick="toggleModal('income' , false)">×</button>
                        </div>
<!--                        <form th:action="@{/addExpense}" method="post">-->
                        <form >
                            <div class="input-section">
                                <input id="income-amount-input" type="number" step="0.01" value="0" class="amount-input" name="amount" required />
                                <div class="select-group">
                                    <select id="income-currency-select" name="currency">
                                        <option>dollars</option>
                                        <option>rupees</option>
                                    </select>
                                    <select id="income-type-select" name="period">
                                        <option>per month</option>
                                        <option>per week</option>
                                    </select>
                                </div>
                                <button type="button" class="icon-trigger" id="incomeIconTrigger">🛒</button>
                                <div class="icon-grid-wrapper" id="incomeIconWrapper">
                                    <div class="icon-grid" id="incomeIconGrid">
                                        <span class="icon-option">🛒</span>
                                        <span class="icon-option">🍽️</span>
                                        <span class="icon-option">🚗</span>
                                        <span class="icon-option">🏠</span>
                                        <span class="icon-option">⚡</span>
                                        <span class="icon-option">📱</span>
                                        <span class="icon-option">🎥</span>
                                        <span class="icon-option">🩺</span>
                                    </div>
                                </div>
                                <input title="title-income-input" type="text" placeholder="TITLE" class="title-input" name="name" required />
                                <input type="hidden" id="incomeIconInput" name="icon" value="🛒" />
                                <button type="button" onclick="addItem()" class="save-btn">SAVE CHANGES</button>
                            </div>
                        </form>
                    </div>
                </div>








                <!-- Expense Modal (Custom) -->
                <div class="modal-overlay" id="expenseModal">
                    <div class="custom-modal">
                        <div class="modal-header">
                            <h2>ADD EXPENSE</h2>
                            <button class="close-btn" onclick="toggleModal('expense' , false)">×</button>
                        </div>
                        <form th:action="@{/addExpense}" method="post">
                            <div class="input-section">
                                <input type="number" step="0.01" value="0" class="amount-input" name="amount" required />
                                <div class="select-group">
                                    <select name="currency">
                                        <option>dollars</option>
                                        <option>rupees</option>
                                    </select>
                                    <select name="period">
                                        <option>per month</option>
                                        <option>per week</option>
                                    </select>
                                </div>
                                <button type="button" class="icon-trigger" id="expenseIconTrigger">🛒</button>
                                <div class="icon-grid-wrapper" id="expenseIconWrapper">
                                    <div class="icon-grid" id="expenseIconGrid">
                                        <span class="icon-option">🛒</span>
                                        <span class="icon-option">🍽️</span>
                                        <span class="icon-option">🚗</span>
                                        <span class="icon-option">🏠</span>
                                        <span class="icon-option">⚡</span>
                                        <span class="icon-option">📱</span>
                                        <span class="icon-option">🎥</span>
                                        <span class="icon-option">🩺</span>
                                    </div>
                                </div>
                                <input type="text" placeholder="TITLE" class="title-input" name="name" required />
                                <input type="hidden" id="expenseIconInput" name="icon" value="🛒" />
                                <button type="submit" class="save-btn">SAVE CHANGES</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>


        </div>

    </div>
</div>

<!-- Aligned hr and Save Button matching top 3 columns -->
<div class="container mt-4">
    <div class="row">
        <div class="col-md-10 offset-md-1">
            <hr class="border-info opacity-50">
        </div>
    </div>
    <div class="row mb-5">
        <div class="col-md-4 offset-md-4 text-center">
            <button class="btn btn-outline-info px-4 animated-button">SAVE CHANGES</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    let account = /*[[${account}]]*/ {};
    if (!account.incomes) account.incomes = [];  // Safety check


    function addItem(){
        const amount = parseFloat(document.getElementById("income-amount-input").value);
        const currency = document.getElementById("income-currency-select").value;
        const period = document.getElementById("income-type-select").value;
        const icon = document.getElementById("incomeIconInput").value;
        const title = document.querySelector('input[title="title-income-input"]').value;




        const newItem = {
            title,
            amount,
            currency,
            period,
            icon
        };

        account.incomes.push(newItem);



        console.log(newItem)
        console.log(account)


    }





    function toggleModal(type , open ) {
        const modalId =type==='income'  ? 'incomeModal' : 'expenseModal';
        const iconWrapperId = type === 'income' ? 'incomeIconWrapper' : 'expenseIconWrapper';

        const modal = document.getElementById(modalId);
        const iconWrapper = document.getElementById(iconWrapperId);

        if (!modal) return;

        if(open) {
            modal.classList.add('show');
        }else {
            modal.classList.remove('show');
            if(iconWrapper) iconWrapper.classList.remove('show')
        }



        // if (modal.classList.contains('modal-overlay')) {
        //     modal.classList.toggle('show');
        //     if (!modal.classList.contains('show')) {
        //         const iconWrapper = document.getElementById('expenseIconWrapper');
        //         if (iconWrapper) iconWrapper.classList.remove('show');
        //     }
        // } else {
        //     const bootstrapModal = bootstrap.Modal.getOrCreateInstance(modal);
        //     bootstrapModal.toggle();
        // }
    }
    // Income icon logic
    const incomeTrigger = document.getElementById('incomeIconTrigger');
    const incomeIconWrapper = document.getElementById('incomeIconWrapper');
    const incomeIconInput = document.getElementById('incomeIconInput');

    if (incomeTrigger && incomeIconWrapper) {
        incomeTrigger.addEventListener('click', () => {
            incomeIconWrapper.classList.toggle('show');
        });

        document.querySelectorAll('#incomeIconGrid .icon-option').forEach(icon => {
            icon.addEventListener('click', () => {
                incomeTrigger.textContent = icon.textContent;
                incomeIconInput.value = icon.textContent;
                incomeIconWrapper.classList.remove('show');
            });
        });
    }


    // Expense icon logic
    const expenseTrigger = document.getElementById('expenseIconTrigger');
    const expenseIconWrapper = document.getElementById('expenseIconWrapper');
    const expenseIconInput = document.getElementById('expenseIconInput');

    if (expenseTrigger && expenseIconWrapper) {
        expenseTrigger.addEventListener('click', () => {
            expenseIconWrapper.classList.toggle('show');
        });

        document.querySelectorAll('#expenseIconGrid .icon-option').forEach(icon => {
            icon.addEventListener('click', () => {
                expenseTrigger.textContent = icon.textContent;
                expenseIconInput.value = icon.textContent;
                expenseIconWrapper.classList.remove('show');
            });
        });
    }
</script>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
