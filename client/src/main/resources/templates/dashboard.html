<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Piggy Metrics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .circle-button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 24px;
            border: 1px solid #8ecae6;
            color: #8ecae6;
            background-color: transparent;
            justify-content: center;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .circle-button:hover {
            background-color: rgba(142, 202, 230, 0.1); /* light hover effect */
            cursor: pointer;
        }

        .circle-button:active {
            transform: scale(0.95);
            background-color: rgba(142, 202, 230, 0.2); /* slightly darker on click */
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-top: 10px;
        }
        .section-subtitle {
            font-size: 12px;
            color: #6c757d;
            font-style: italic;
        }
        .custom-toggle {
            width: 20px;
            height: 20px;
        }

        .savings-input {
            width: 120px;
            font-size: 24px;
            font-weight: 400;
            border: none;
            border-bottom: 1px solid #8ecae6;
            border-radius: 0;
            outline: none;
            background-color: transparent;
            color: #212529;
            padding-left: 0;
        }
        .savings-input:focus {
            border-bottom: 2px solid #219ebc;
            box-shadow: none;
        }

    </style>
</head>
<body class="bg-white text-dark">
<div class="container text-center mt-5">
    <img src="/images/piggy-icon.svg" alt="Piggy Icon" style="width: 96px;">
    <h1 class="mt-3 fw-bold">PIGGY <span class="fw-light">METRICS</span></h1>
</div>
<div class="container mt-5">
    <div class="row text-center">

        <!-- Incomes -->
        <div class="col-md-4 mb-4">
            <div class="d-flex align-items-center justify-content-center mb-2" style="gap: 8px;">
                <button class="circle-button d-flex align-items-center justify-content-center"
                        style="width: 24px; height: 24px; font-size: 16px; border-width: 1px;">
                    +
                </button>
                <div class="section-title m-0">INCOMES</div>
            </div>
            <hr class="border-info opacity-50 w-50 mx-auto">
            <div class="section-subtitle mb-3">EMPTY SPACE</div>
            <button class="circle-button">+</button>
            <div class="mt-2" style="font-size: 0.8rem; color: #6c757d;">ADD INCOME</div>

        </div>

        <!-- Expenses -->
        <div class="col-md-4 mb-4">
             <div class="d-flex align-items-center justify-content-center mb-2" style="gap: 8px;">
                <button class="circle-button d-flex align-items-center justify-content-center"
                        style="width: 24px; height: 24px; font-size: 16px; border-width: 1px;">
                    +
                </button>
                <div class="section-title m-0">EXPENSES</div>
            </div>
            <hr class="border-info opacity-50 w-50 mx-auto">
            <div class="section-subtitle mb-3">EMPTY SPACE</div>
            <button class="circle-button">+</button>
            <div class="mt-2" style="font-size: 0.8rem; color: #6c757d;">ADD EXPENSE</div>
        </div>


        <!-- Savings -->
        <div class="col-md-4 mb-4">
            <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
                <span>$</span>
                <div class="section-title m-0">SAVINGS</div>
            </div>


            <hr class="border-info opacity-50 w-50 mx-auto">



            <div class="d-flex justify-content-center align-items-start mt-3">
                <img src="/images/piggy-small.svg" alt="Piggy" style="width: 24px; height: 24px; margin-top: 2px;" class="me-3">
                <div class="text-start">
                    <div style="font-size: 13px; font-weight: 500;">MY SPARE MONEY</div>
                    <div style="font-size: 11px; font-style: italic; color: #8ecae6;">AT THE MOMENT</div>
                    <input type="text" class="savings-input mt-2" placeholder="0.00">
                </div>
            </div>

<!--            <div class="d-flex justify-content-center align-items-center mt-3">-->
<!--                <img src="/images/piggy-small.svg" alt="Piggy" style="width: 24px; height: 24px;" class="me-3">-->
<!--                <div class="text-start">-->
<!--                    <div style="font-size: 13px; font-weight: 500;">MY SPARE MONEY</div>-->
<!--                    <div style="font-size: 11px; font-style: italic; color: #8ecae6;">AT THE MOMENT</div>-->
<!--                    <input type="text" class="savings-input mt-2" placeholder="0.00">-->

<!--                </div>-->
<!--            </div>-->



        </div>


    </div>

</div>



<div class="text-center mt-4 mb-5">
    <button class="btn btn-outline-info px-4">SAVE CHANGES</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
